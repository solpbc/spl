# --- journal identity --------------------------------------------------------
# The jid derivation, its refusal vocabulary, and the statement of what a device
# id is. Grounded in proto/identity.md; the conformance vectors bind to these ids.

[[journal_identity]]
id = "journal_identity.key_domain"
kind = "key_domain"
value = "DER SubjectPublicKeyInfo carrying an EC public key on P-256 (secp256r1, OID 1.2.840.10045.3.1.7), parsed and re-serialized to canonical form before derivation"
citation = "identity_key_domain"

[[journal_identity]]
id = "journal_identity.kdf"
kind = "kdf"
value = "HKDF-SHA256 over the canonical SubjectPublicKeyInfo DER, salt solstone/journal/v1, info solstone/jid/uuidv8/v1, output length 16 bytes"
citation = "identity_kdf"

[[journal_identity]]
id = "journal_identity.stamp.version"
kind = "stamp"
value = "byte 6 of the 16-byte output becomes (byte6 AND 0x0F) OR 0x80, the UUID version 8 nibble"
citation = "identity_stamp_version"

[[journal_identity]]
id = "journal_identity.stamp.variant"
kind = "stamp"
value = "byte 8 of the 16-byte output becomes (byte8 AND 0x3F) OR 0x80, the RFC 9562 variant bits"
citation = "identity_stamp_variant"

[[journal_identity]]
id = "journal_identity.refusal.not_p256"
kind = "refusal"
value = "the algorithm is not id-ecPublicKey, or the named curve is not P-256"
citation = "identity_refusal_not_p256"

[[journal_identity]]
id = "journal_identity.refusal.invalid_point"
kind = "refusal"
value = "the structure parses and names P-256, but the public point does not lie on the curve"
citation = "identity_refusal_invalid_point"

[[journal_identity]]
id = "journal_identity.refusal.malformed_spki"
kind = "refusal"
value = "the input is not a well-formed SubjectPublicKeyInfo"
citation = "identity_refusal_malformed_spki"

[[journal_identity]]
id = "journal_identity.did"
kind = "device_fingerprint"
value = "the did is SHA-256 over the client certificate DER, lowercase hex with a sha256: prefix, carried as device_fp in token claims and as fingerprint in the authorized-client ledger; it is not derived, carries no mark, and is not the device_id in a session.dial token subject"
citation = "identity_device_id"

