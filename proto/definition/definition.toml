bundle_semver = "4.0.1"

# Citation markers are exact source substrings. The longer markers below are
# deliberate: the obvious markers `0x01` = IPv4, first 16 bytes of SHA-256
# over the CA cert DER, loopback, 128-bit single-use nonce, unsigned
# big-endian, and selector `0x00` each occur more than once across the cited
# documents. Marker length alone is not enough: `0x01` = IPv4 is 13
# characters and still occurs twice.

