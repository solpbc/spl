name = "spl-relay"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Disable the *.workers.dev preview URL. The admin surface is bearer-gated in
# the Worker, but a live workers.dev hostname is an unnecessary second ingress;
# the hosted relay is reached only via the custom domain. (CSO audit F5.)
workers_dev = false

# Production routes are wired per environment; self-hosters replace these
# values with their own hostnames before `wrangler deploy`. Sol pbc's hosted
# relay is at link.solstone.app.
# routes = [
#   { pattern = "link.solstone.app", custom_domain = true }
# ]

[observability]
enabled = true

[observability.logs]
# Invocation logs include the fetch method and URL. WebSocket clients may use
# `?token=` when they cannot set Authorization headers, so keep custom JSON
# application logs but do not store request URLs in Workers Logs.
invocation_logs = false

[durable_objects]
bindings = [
  { name = "INSTANCE", class_name = "InstanceDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InstanceDO"]

# Non-secret configuration. Secrets (SIGNING_JWK, JWKS_PUBLIC, GRANT_SECRET)
# are set via `wrangler secret put` and are NEVER committed here. ISSUER is the
# JWT `iss` claim the Worker enforces on every verify; self-hosters override in
# their env block. ENTITLEMENT_REQUIRED is unset in this block, and only the
# exact string "true" enables the session gate — but [env.production] below
# sets it "true", and that is the env `make deploy` uses.
[vars]
ENVIRONMENT = "development"
ISSUER = "spl.local"

# D1 database for token metadata. Override `database_id` per environment.
# `database_id` is populated by `wrangler d1 create` and is not sensitive —
# but we leave it blank by default so `wrangler deploy` fails loudly if the
# operator hasn't provisioned D1 yet.
[[d1_databases]]
binding = "DB"
database_name = "spl-relay-dev"
database_id = ""
migrations_dir = "migrations"

# Production environment. Secrets are provisioned with `wrangler secret put`;
# the custom domain route is created by `wrangler deploy --env production`.
#
# ENTITLEMENT_REQUIRED is "true" below: the paid-tier go-live has happened and
# the gate is ON in production. It is read at exactly two call sites, the
# /session/listen and /session/dial handlers, which answer 402 for an instance
# with no live grant; pair-window, pair-dial and /tunnel/<id> never consult it.
# Anyone deploying with --env production (which is what `make deploy` runs) must
# either clear this variable in their own config or push a grant per instance
# via POST /admin/entitlement.
[env.production]
name = "spl-relay"
workers_dev = false
routes = [{ pattern = "link.solstone.app", custom_domain = true }]
# PRESENCE_HOLD_ENABLED = "true" turns on presence-based reconnect: an offline-home
# /session/dial is HELD open (hibernating) and brokered when the home appears, instead of 503.
# Only the exact string "true" enables it; revert = set "false" (or remove) + redeploy.
vars = { ENVIRONMENT = "production", ISSUER = "link.solstone.app", ENTITLEMENT_REQUIRED = "true", PRESENCE_HOLD_ENABLED = "true" }

[env.production.observability]
enabled = true

[env.production.observability.logs]
# Production must not emit request URL invocation logs because WebSocket query
# tokens are valid bearer credentials for clients without header support.
invocation_logs = false

[[env.production.d1_databases]]
binding = "DB"
database_name = "spl-relay"
database_id = "989a04e6-09b0-4176-a228-e49b61401908"
migrations_dir = "migrations"

[[env.production.durable_objects.bindings]]
name = "INSTANCE"
class_name = "InstanceDO"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["InstanceDO"]
